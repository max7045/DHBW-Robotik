ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true    
    publish_tf: true    
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # --- 1. SENSOR: Die Räder (Gazebo Odometrie) ---
    odom0: /odom
    odom0_config: [true,  true,  false,  # X, Y (Wir vertrauen den Rädern für die Distanz)
                   false, false, false,  # Roll, Pitch, Yaw (Ignoriert, da fehleranfällig)
                   true,  true,  false,  # Geschwindigkeit X, Y
                   false, false, true,   # Yaw-Geschwindigkeit
                   false, false, false]
    odom0_differential: false

    # --- 2. SENSOR: Der Kompass (IMU) ---
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,    # Yaw/Gieren (Die exakte Rotation ist das Wichtigste!)
                  false, false, false,
                  false, false, true,    # Yaw-Geschwindigkeit
                  true,  true,  false]   # Lineare Beschleunigung
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true